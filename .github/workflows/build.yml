name: 构建测试

on:
  push:
    branches:
      - 'version/**'
      - 'master'
      - 'main'
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    branches:
      - 'version/**'
      - 'master'
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew
      
      - name: 构建项目
        run: ./gradlew clean build shadowJar --no-daemon
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WorldGuard-Artifacts
          path: |
            worldguard-bukkit/build/libs/*.jar
          retention-days: 7
      
      - name: 构建摘要
        run: |
          echo "## 构建成功 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh worldguard-bukkit/build/libs/*.jar 2>/dev/null || echo "未找到 JAR 文件"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

