  passthrough-title: "<red><bold>WARNING:</bold></red>"
  passthrough-message: "<red>This flag is unrelated to moving through regions.</red>"
  passthrough-info: "It overrides build checks. If you're unsure what this means, see the documentation."
  build-title: "<red><bold>WARNING:</bold></red>"
  build-message: "<red>Setting this flag is not required for protection.</red>"
  build-info: "Setting this flag will completely override default protection, and apply to members, non-members, pistons, sand physics, and everything else that can modify blocks."
  build-warning: "Only set this flag if you are sure you know what you are doing. See the documentation for more info."
  location-outside: "<yellow>WARNING: Flag location is outside of region.</yellow>"
  documentation-link: "[this documentation page]"
  documentation-suffix: " for more information."
  protection-documentation-url: "https://worldguard.enginehub.org/en/latest/regions/flags/#protection-related"
  overrides-documentation-url: "https://worldguard.enginehub.org/en/latest/regions/flags/#overrides"

